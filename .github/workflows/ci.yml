name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    name: Tools and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test
      - name: Address and undefined behavior sanitizers
        run: >-
          make test CC=clang BUILD=build/asan
          CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          LDFLAGS='-fsanitize=address,undefined'
      - name: Fuzz the attribute encoding (libFuzzer, bounded time)
        run: make fuzz FUZZ_TIME=30
      - name: Benchmark harness smoke test (correctness only, no numbers)
        run: |
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libsqlite3-dev sqlite3
          make bench-smoke
      - name: Benchmark harness smoke test under address and undefined behavior sanitizers
        # a tool killed by a sanitizer can still leave the expected (empty) answer behind, so the
        # step also fails on any sanitizer report in the output, not only on the exit status
        run: |
          make bench-smoke CC=clang BUILD=build/asan-bench \
            CFLAGS='-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined' 2>&1 | tee /tmp/bench-smoke-asan.log
          if grep -qE 'runtime error|ERROR: AddressSanitizer|ERROR: LeakSanitizer' /tmp/bench-smoke-asan.log; then exit 1; fi
      - name: Adversarial lower trees through the tools, under sanitizers (security roadmap S4)
        run: |
          make hostile-test CC=clang BUILD=build/asan-hostile HOSTILE_SEEDS=50 \
            CFLAGS='-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined' 2>&1 | tee /tmp/hostile-asan.log
          grep -q '^HOSTILE_USER_PASS' /tmp/hostile-asan.log
          if grep -qE 'runtime error|ERROR: AddressSanitizer' /tmp/hostile-asan.log; then exit 1; fi
      - name: Big-endian run of the attribute encoding and image tools (s390x, QEMU user mode)
        # The encoding is little-endian on disk and the code assembles it byte by byte; this runs
        # the same unit and image tests on a big-endian target to keep it so (journal 0123).
        run: |
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user-static
          make test CC=s390x-linux-gnu-gcc BUILD=build/s390x LDFLAGS=-static
      - name: Validate site links
        run: python3 scripts/check-site.py
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck
      - name: shellcheck and SPDX headers (same command as locally)
        run: make lint   # info-level shellcheck findings are tracked as issues
      - name: No retired claim in a current-state document; the FAQ page matches docs/faq.md (journal 0126)
        run: |
          sh scripts/check-retired-claims.sh
          python3 scripts/site-faq.py --check
      - name: checkpatch.pl on layer/ and kernel/ (required since journal 0050)
        run: make checkpatch
      - name: DCO sign-off on every commit in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch --no-tags origin "$BASE_REF"
          bad=0
          for c in $(git rev-list "origin/$BASE_REF..HEAD" --no-merges); do
            if ! git log -1 --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "commit $c lacks a Signed-off-by line (use git commit -s)"
              git log -1 --format='  %h %s' "$c"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]
  native:
    name: Native Linux VM
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make vm-test
      - name: Preserve VM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-vm-evidence
          path: |
            build/vm/console.log
            build/vm/image-report.json
            build/vm/environment.txt
            build/vm/kernel.config
          if-no-files-found: warn
          retention-days: 30
