version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # CodeQL refuses to run when its init and analyze steps differ in version,
    # so its actions are bumped together in one pull request.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
